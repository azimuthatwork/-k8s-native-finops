apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: logevents.finops.io
  labels:
    app.kubernetes.io/name: cost-controller
    app.kubernetes.io/part-of: kube-native-finops
spec:
  group: finops.io
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                eventType:
                  type: string
                  enum: ["OOMKilling", "Evicted", "FailedScheduling", "Killing", "FailedMount", "CrashLoopBackOff", "BackOff", "Error", "Warning"]
                involvedObject:
                  type: object
                  properties:
                    apiVersion:
                      type: string
                    kind:
                      type: string
                    name:
                      type: string
                    namespace:
                      type: string
                    uid:
                      type: string
                  required: ["apiVersion", "kind", "name", "namespace", "uid"]
                reason:
                  type: string
                message:
                  type: string
                source:
                  type: string
                count:
                  type: integer
                firstTimestamp:
                  type: string
                  format: date-time
                lastTimestamp:
                  type: string
                  format: date-time
                namespaceLabels:
                  type: object
                  additionalProperties:
                    type: string
                workloadRef:
                  type: object
                  properties:
                    apiVersion:
                      type: string
                    kind:
                      type: string
                    name:
                      type: string
                    namespace:
                      type: string
            status:
              type: object
              properties:
                processed:
                  type: boolean
                processedAt:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
      subresources:
        status: {}
  scope: Cluster
  names:
    plural: logevents
    singular: logevent
    kind: LogEvent
    shortNames:
      - logevent
    categories:
      - finops
      - cost-management
