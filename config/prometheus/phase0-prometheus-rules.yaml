# Phase 0 Validation PrometheusRules
# These rules can be deployed to validate the Prometheus/Thanos setup
# Apply with: kubectl apply -f config/prometheus/phase0-prometheus-rules.yaml

apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: phase0-validation-rules
  namespace: monitoring
  labels:
    app: phase0-validation
    prometheus: k8s
spec:
  groups:
  - name: phase0.infrastructure.validation
    interval: 30s
    rules:
    # Alloy DaemonSet Health
    - alert: AlloyDaemonSetDown
      expr: |
        count(kube_daemonset_status_desired_number_scheduled{namespace="monitoring", daemonset="alloy-daemonset"}) 
        - count(kube_daemonset_status_number_ready{namespace="monitoring", daemonset="alloy-daemonset"}) > 0
      for: 5m
      labels:
        severity: critical
        category: phase0-validation
      annotations:
        summary: "Alloy DaemonSet has unready pods"
        description: "{{ $value }} Alloy DaemonSet pods are not ready in monitoring namespace"
        runbook: "https://wiki.internal/phase0-troubleshooting#alloy-daemonset"

    # Alloy Central Health
    - alert: AlloyCentralDown
      expr: |
        kube_deployment_status_replicas_available{namespace="monitoring", deployment="alloy-central"} 
        < kube_deployment_spec_replicas{namespace="monitoring", deployment="alloy-central"}
      for: 5m
      labels:
        severity: critical
        category: phase0-validation
      annotations:
        summary: "Alloy Central deployment not fully ready"
        description: "Alloy Central has {{ $value }} fewer ready replicas than desired"

    # Prometheus HA Health
    - alert: PrometheusHAIncomplete
      expr: |
        count(kube_pod_status_ready{namespace="monitoring", prometheus="k8s", condition="true"}) < 2
      for: 5m
      labels:
        severity: critical
        category: phase0-validation
      annotations:
        summary: "Prometheus HA pair incomplete"
        description: "Only {{ $value }} Prometheus pods ready (expected 2)"

    # Thanos Components Health
    - alert: ThanosQueryDown
      expr: |
        kube_deployment_status_replicas_available{namespace="monitoring", deployment="thanos-query"} 
        < kube_deployment_spec_replicas{namespace="monitoring", deployment="thanos-query"}
      for: 5m
      labels:
        severity: critical
        category: phase0-validation
      annotations:
        summary: "Thanos Query not fully ready"

    - alert: ThanosStoreDown
      expr: |
        kube_statefulset_status_replicas_ready{namespace="monitoring", statefulset="thanos-store"} 
        < kube_statefulset_spec_replicas{namespace="monitoring", statefulset="thanos-store"}
      for: 5m
      labels:
        severity: critical
        category: phase0-validation
      annotations:
        summary: "Thanos Store not fully ready"

    - alert: ThanosCompactDown
      expr: |
        kube_deployment_status_replicas_available{namespace="monitoring", deployment="thanos-compact"} 
        < kube_deployment_spec_replicas{namespace="monitoring", deployment="thanos-compact"}
      for: 5m
      labels:
        severity: warning
        category: phase0-validation
      annotations:
        summary: "Thanos Compact not ready"

    # Thanos Object Storage
    - alert: ThanosObjectStorageConfigMissing
      expr: |
        absent(kube_secret_info{namespace="monitoring", secret="thanos-objstore-config"})
      for: 1m
      labels:
        severity: critical
        category: phase0-validation
      annotations:
        summary: "Thanos object storage config secret missing"
        description: "Secret 'thanos-objstore-config' not found in monitoring namespace"

    # Network Connectivity (via blackbox exporter if available)
    - alert: AlloyToPrometheusConnectivityFailed
      expr: |
        probe_success{job="alloy-to-prometheus", namespace="monitoring"} == 0
      for: 2m
      labels:
        severity: critical
        category: phase0-validation
      annotations:
        summary: "Alloy DaemonSet cannot reach Prometheus"
        description: "Connectivity probe from Alloy to Prometheus failed"

    - alert: PrometheusToKSMConnectivityFailed
      expr: |
        probe_success{job="prometheus-to-ksm", namespace="monitoring"} == 0
      for: 2m
      labels:
        severity: critical
        category: phase0-validation
      annotations:
        summary: "Prometheus cannot reach kube-state-metrics"

    # Namespace Labeling Compliance
    - alert: NamespaceMissingCostCenterLabel
      expr: |
        count(kube_namespace_labels{label_cost_center=""}) by (namespace) > 0
      for: 10m
      labels:
        severity: warning
        category: phase0-validation
      annotations:
        summary: "Namespace missing cost-center label"
        description: "Namespace {{ $labels.namespace }} is missing required cost-center label"

    - alert: NamespaceMissingTeamLabel
      expr: |
        count(kube_namespace_labels{label_team=""}) by (namespace) > 0
      for: 10m
      labels:
        severity: warning
        category: phase0-validation
      annotations:
        summary: "Namespace missing team label"
        description: "Namespace {{ $labels.namespace }} is missing required team label"

    # CRD Availability
    - alert: RequiredCRDMissing
      expr: |
        absent(apiextensions_v1_custom_resource_definition{name=~"servicemonitors\\.monitoring\\.coreos\\.com|podmonitors\\.monitoring\\.coreos\\.com|prometheusrules\\.monitoring\\.coreos\\.com|prometheuses\\.monitoring\\.coreos\\.com"})
      for: 1m
      labels:
        severity: critical
        category: phase0-validation
      annotations:
        summary: "Required Prometheus Operator CRD missing"
        description: "One or more required CRDs are not installed"

    # Grafana Connectivity
    - alert: GrafanaThanosQueryConnectivityFailed
      expr: |
        probe_success{job="grafana-to-thanos-query", namespace="observability"} == 0
      for: 2m
      labels:
        severity: critical
        category: phase0-validation
      annotations:
        summary: "Grafana cannot reach Thanos Query"

    - alert: GrafanaLokiQueryConnectivityFailed
      expr: |
        probe_success{job="grafana-to-loki-query", namespace="observability"} == 0
      for: 2m
      labels:
        severity: critical
        category: phase0-validation
      annotations:
        summary: "Grafana cannot reach Loki Query"
