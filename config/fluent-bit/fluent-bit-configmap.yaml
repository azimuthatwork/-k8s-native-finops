apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: monitoring
  labels:
    app: fluent-bit
    component: log-tailer
data:
  # Fluent Bit main configuration
  fluent-bit.conf: |
    [SERVICE]
        Flush         5
        Log_Level     info
        Daemon        off
        Parsers_File  parsers.conf
        HTTP_Server   On
        HTTP_Listen   0.0.0.0
        HTTP_Port     2020
        Health_Check  On

    @INCLUDE input-kubernetes.conf
    @INCLUDE filter-kubernetes.conf
    @INCLUDE output-http.conf

  # Input configuration - tail container logs
  input-kubernetes.conf: |
    [INPUT]
        Name              tail
        Tag               kube.*
        Path              /var/log/containers/*.log
        Parser            docker
        DB                /var/log/flb_kube.db
        Mem_Buf_Limit     50MB
        Skip_Long_Lines   On
        Refresh_Interval  10
        Rotate_Wait       30
        storage.type      filesystem
        Read_from_Head    Off

  # Filter configuration - enrich with Kubernetes metadata
  filter-kubernetes.conf: |
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix     kube.var.log.containers.
        Merge_Log           On
        Merge_Log_Key       log_processed
        K8S-Logging.Parser  On
        K8S-Logging.Exclude On
        Labels              On
        Annotations         Off

    # Add cost-center and team labels from namespace
    [FILTER]
        Name          modify
        Match         kube.*
        Add           cluster_name ${CLUSTER_NAME}
        Add           cost_center ${COST_CENTER}
        Add           team ${TEAM}

    # Parse structured logs (JSON)
    [FILTER]
        Name          parser
        Match         kube.*
        Key_Name      log
        Parser        json
        Reserve_Data  On
        Preserve_Key  On

    # Detect error patterns in log messages
    [FILTER]
        Name          grep
        Match         kube.*
        Regex         log (OOM|OutOfMemory|Error|Exception|Killed|Fatal|Panic|CrashLoopBackOff)

  # Output configuration - send to cost-controller API
  output-http.conf: |
    [OUTPUT]
        Name            http
        Match           kube.*
        Host            cost-controller.cost-management.svc.cluster.local
        Port            8081
        URI             /api/v1/logs
        Format          json
        Json_Date_Key   timestamp
        Json_Date_Format iso8601
        Header          Content-Type application/json
        Header          Authorization Bearer ${SERVICE_ACCOUNT_TOKEN}
        Retry_Limit     3
        Compress        gzip
        Buffer_Size     64k

  # Parsers for different log formats
  parsers.conf: |
    [PARSER]
        Name        docker
        Format      json
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L
        Time_Keep   On
        Decode_Field_As   escaped_tag log

    [PARSER]
        Name        json
        Format      json
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L
        Time_Keep   On

    [PARSER]
        Name        syslog
        Format      regex
        Regex       ^(?<time>\S+ \S+ \S+) (?<host>\S+) (?<ident>\S+)(?:\[(?<pid>\d+)\])?: (?<message>.*)$
        Time_Key    time
        Time_Format %b %d %H:%M:%S

    # Custom parser for error detection
    [PARSER]
        Name        error-pattern
        Format      regex
        Regex       ^(?<time>\S+) (?<level>\w+) (?<message>.*)$
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%LZ
