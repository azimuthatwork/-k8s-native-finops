apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cost-controller
  namespace: cost-management
  labels:
    app.kubernetes.io/name: cost-controller
    app.kubernetes.io/part-of: kube-native-finops
spec:
  serviceName: cost-controller
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cost-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cost-controller
        app.kubernetes.io/part-of: kube-native-finops
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: cost-controller-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
      - name: cost-controller
        image: ghcr.io/yourorg/kube-native-finops/cost-controller:latest
        imagePullPolicy: Always
        args:
        - --leader-elect=true
        - --metrics-bind-address=:8080
        - --health-probe-bind-address=:8081
        - --tsdb-data-dir=/data/tsdb
        - --tsdb-retention=336h
        - --tsdb-max-series=500000
        ports:
        - containerPort: 8080
          name: metrics
        - containerPort: 8081
          name: health
        - containerPort: 8082
          name: api
        - containerPort: 9091
          name: wal-replication
        resources:
          requests:
            cpu: "500m"
            memory: "2Gi"
          limits:
            cpu: "2000m"
            memory: "8Gi"
        volumeMounts:
        - name: tsdb-data
          mountPath: /data/tsdb
        - name: config
          mountPath: /etc/config
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 10
          periodSeconds: 5
      - name: snapshotter
        image: ghcr.io/yourorg/kube-native-finops/tsdb-snapshotter:latest
        imagePullPolicy: Always
        args:
        - --interval=6h
        - --bucket=s3://finops-bucket/tsdb-snapshots
        - --data-dir=/data/tsdb
        volumeMounts:
        - name: tsdb-data
          mountPath: /data/tsdb
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
      volumes:
      - name: config
        configMap:
          name: cost-controller-config
  volumeClaimTemplates:
  - metadata:
      name: tsdb-data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: "fast-ssd"
      resources:
        requests:
          storage: 500Gi
