apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: nodecosts.finops.io
  labels:
    app.kubernetes.io/name: cost-controller
    app.kubernetes.io/part-of: kube-native-finops
spec:
  group: finops.io
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                nodeName:
                  type: string
                instanceType:
                  type: string
                zone:
                  type: string
                capacity:
                  type: object
                  properties:
                    cpu:
                      type: string
                    memory:
                      type: string
                    gpu:
                      type: integer
                allocatable:
                  type: object
                  properties:
                    cpu:
                      type: string
                    memory:
                      type: string
                    gpu:
                      type: integer
            status:
              type: object
              properties:
                hourlyCostUSD:
                  type: number
                  format: double
                cpuUtilization:
                  type: number
                  format: double
                memoryUtilization:
                  type: number
                  format: double
                instanceType:
                  type: string
                zone:
                  type: string
                costCenter:
                  type: string
                lastUpdate:
                  type: string
                  format: date-time
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
      subresources:
        status: {}
  scope: Cluster
  names:
    plural: nodecosts
    singular: nodecost
    kind: NodeCost
    shortNames:
      - nodecost
    categories:
      - finops
      - cost-management
