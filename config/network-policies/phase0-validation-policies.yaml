---
# 4. Alloy DaemonSet -> Prometheus (Ingress to Prometheus)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus-ingress-from-alloy-daemonset
  namespace: monitoring
  labels:
    phase: "0-validation"
    component: "prometheus-scraping"
spec:
  podSelector:
    matchLabels:
      prometheus: k8s  # Prometheus pods label
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
      podSelector:
        matchLabels:
          app: alloy-daemonset
    ports:
    - protocol: TCP
      port: 9090

