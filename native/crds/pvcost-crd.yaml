apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: pvcosts.finops.io
  labels:
    app.kubernetes.io/name: cost-controller
    app.kubernetes.io/part-of: kube-native-finops
spec:
  group: finops.io
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                pvcRef:
                  type: object
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
                  required: ["name", "namespace"]
                storageClass:
                  type: string
                volumeMode:
                  type: string
                accessModes:
                  type: array
                  items:
                    type: string
                capacity:
                  type: object
                  properties:
                    storage:
                      type: string
            status:
              type: object
              properties:
                monthlyCostUSD:
                  type: number
                  format: double
                requestedGB:
                  type: number
                  format: double
                usedGB:
                  type: number
                  format: double
                storageClass:
                  type: string
                costCenter:
                  type: string
                lastUpdate:
                  type: string
                  format: date-time
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
      subresources:
        status: {}
  scope: Namespaced
  names:
    plural: pvcosts
    singular: pvcost
    kind: PVCost
    shortNames:
      - pvcost
    categories:
      - finops
      - cost-management
