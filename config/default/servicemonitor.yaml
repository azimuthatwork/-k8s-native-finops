apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cost-controller
  namespace: cost-management
  labels:
    app.kubernetes.io/name: cost-controller
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: cost-controller
  endpoints:
  - port: metrics
    path: /metrics
    interval: 30s
    scheme: http
  - port: api
    path: /metrics
    interval: 30s
    scheme: http
  namespaceSelector:
    matchNames:
    - cost-management
