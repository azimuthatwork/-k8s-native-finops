apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- rbac.yaml
- service.yaml
- statefulset.yaml
- servicemonitor.yaml

commonLabels:
  app.kubernetes.io/name: cost-controller
  app.kubernetes.io/part-of: kube-native-finops

images:
- name: cost-controller
  newTag: latest

configMapGenerator:
- name: cost-controller-config
  literals:
  - TSDB_DATA_DIR=/data/tsdb
  - TSDB_RETENTION=336h
  - TSDB_MAX_SERIES=500000
  - CLOUD_PROVIDER=aws
  - PRICING_CONFIGMAP=storage-pricing
