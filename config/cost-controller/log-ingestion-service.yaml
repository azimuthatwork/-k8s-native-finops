apiVersion: v1
kind: Service
metadata:
  name: cost-controller-logs
  namespace: cost-management
  labels:
    app: cost-controller
    component: log-ingestion
spec:
  type: ClusterIP
  ports:
  - name: logs
    port: 8081
    targetPort: 8081
    protocol: TCP
  selector:
    app: cost-controller
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cost-controller-log-ingress
  namespace: cost-management
spec:
  podSelector:
    matchLabels:
      app: cost-controller
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    - podSelector:
        matchLabels:
          app: fluent-bit
    ports:
    - protocol: TCP
      port: 8081
