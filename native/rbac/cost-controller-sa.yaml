apiVersion: v1
kind: ServiceAccount
metadata:
  name: cost-controller-sa
  namespace: cost-management
  labels:
    app.kubernetes.io/name: cost-controller
    app.kubernetes.io/part-of: kube-native-finops
  annotations:
    # AWS IRSA - Replace with your role ARN
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/CostControllerIRSA
    # GCP Workload Identity - Replace with your service account email
    # iam.gke.io/gcp-service-account: cost-controller@my-project.iam.gserviceaccount.com
    # Azure Workload Identity - Replace with your client ID
    # azure.workload.identity/client-id: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cost-controller-reader
  labels:
    app.kubernetes.io/name: cost-controller
    app.kubernetes.io/part-of: kube-native-finops
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "namespaces", "persistentvolumes", "persistentvolumeclaims", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["finops.io"]
    resources: ["costallocations", "nodecosts", "pvcosts", "costhistories", "rightsizingrecommendations", "namespacebudgets", "logevents"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cost-controller-reader-binding
  labels:
    app.kubernetes.io/name: cost-controller
    app.kubernetes.io/part-of: kube-native-finops
subjects:
  - kind: ServiceAccount
    name: cost-controller-sa
    namespace: cost-management
roleRef:
  kind: ClusterRole
  name: cost-controller-reader
  apiGroup: rbac.authorization.k8s.io
