# Phase 0 Network Policy Validation Policies
# These NetworkPolicies define the REQUIRED connectivity for the observability platform
# Apply with: kubectl apply -f config/network-policies/phase0-validation-policies.yaml

---
# 1. Monitoring Namespace Egress to Object Storage (Thanos/Loki)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monitoring-egress-object-storage
  namespace: monitoring
  labels:
    phase: "0-validation"
    component: "thanos-loki-storage"
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  # Allow HTTPS to cloud object storage (S3/GCS/Azure)
  - to:
    - namespaceSelector: {}  # Allow to any namespace (external IPs)
    ports:
    - protocol: TCP
      port: 443
  # Allow DNS resolution
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53

