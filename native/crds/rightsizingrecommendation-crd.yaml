apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: rightsizingrecommendations.finops.io
  labels:
    app.kubernetes.io/name: cost-controller
    app.kubernetes.io/part-of: kube-native-finops
spec:
  group: finops.io
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                targetRef:
                  type: object
                  properties:
                    apiVersion:
                      type: string
                    kind:
                      type: string
                    name:
                      type: string
                    namespace:
                      type: string
                  required: ["apiVersion", "kind", "name", "namespace"]
                currentRequests:
                  type: object
                  properties:
                    cpu:
                      type: string
                    memory:
                      type: string
                recommendedRequests:
                  type: object
                  properties:
                    cpu:
                      type: string
                    memory:
                      type: string
                estimatedMonthlySavingsUSD:
                  type: number
                  format: double
                confidence:
                  type: string
                  enum: ["High", "Medium", "Low"]
                window:
                  type: string
            status:
              type: object
              properties:
                status:
                  type: string
                  enum: ["Pending", "Approved", "Applied", "Rejected", "Expired"]
                approvedBy:
                  type: string
                approvedAt:
                  type: string
                  format: date-time
                appliedAt:
                  type: string
                  format: date-time
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
      subresources:
        status: {}
  scope: Namespaced
  names:
    plural: rightsizingrecommendations
    singular: rightsizingrecommendation
    kind: RightsizingRecommendation
    shortNames:
      - rightsizing
      - rr
    categories:
      - finops
      - cost-management
